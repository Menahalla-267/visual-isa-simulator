<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual ISA & Cache Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-mono h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center shadow-md">
        <h1 class="text-base font-bold tracking-wider text-emerald-400">Visual ISA & Cache Simulator</h1>
        <span id="status-badge" class="px-3 py-1 bg-emerald-900/50 text-emerald-300 border border-emerald-700 text-xs rounded-full">Status: Ready</span>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <!-- Left Column: Script Editor & Execution Log -->
        <div class="w-1/2 flex flex-col gap-4">
            <!-- Script Editor Box -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col shadow h-48">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">Assembly Program (Multi-Line)</label>
                    <div class="space-x-2">
                        <button onclick="loadScript()" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-1 rounded text-xs transition">Load Program</button>
                        <button onclick="stepInstruction()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs transition">Step (PC)</button>
                        <button onclick="resetSimulator()" class="bg-rose-600/80 hover:bg-rose-500 text-white px-3 py-1 rounded text-xs transition">Reset</button>
                    </div>
                </div>
                <textarea id="script-input" class="flex-1 bg-slate-900 border border-slate-600 rounded-lg p-2 text-emerald-300 focus:outline-none focus:border-emerald-500 font-mono text-xs resize-none">LW R3, 8
LW R4, 12
ADD R5, R3, R4
SW R5, 16</textarea>
            </div>

            <!-- Execution Log Area -->
            <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col shadow-inner overflow-hidden">
                <span class="text-xs text-slate-500 uppercase tracking-widest mb-2 font-bold">Execution Log</span>
                <div id="log-area" class="flex-1 overflow-y-auto font-mono text-xs text-slate-300 space-y-1 pr-2">
                    <p class="text-slate-500">[System] Simulator loaded. Click 'Load Program' to begin.</p>
                </div>
            </div>
        </div>

        <!-- Right Column: Registers, Cache, and Main Memory -->
        <div class="w-1/2 flex flex-col gap-3 overflow-y-auto pr-1">
            
            <!-- Registers & Cache Row -->
            <div class="flex gap-3 h-52">
                <!-- Register Viewer -->
                <div class="w-1/2 bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col shadow overflow-hidden">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-1 mb-2">Registers</h2>
                    <div id="register-grid" class="flex-1 grid grid-cols-2 gap-1.5 overflow-y-auto pr-1 text-xs"></div>
                </div>

                <!-- Cache Table -->
                <div class="w-1/2 bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col shadow overflow-hidden">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-1 mb-2">
                        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Cache</h2>
                        <span id="cache-stats" class="text-[10px] text-slate-400">H: 0 | M: 0</span>
                    </div>
                    <div class="overflow-y-auto flex-1">
                        <table class="w-full text-left border-collapse text-[11px]">
                            <thead>
                                <tr class="text-slate-400 border-b border-slate-700">
                                    <th class="pb-1 px-1">Idx</th>
                                    <th class="pb-1 px-1">V</th>
                                    <th class="pb-1 px-1">Tag</th>
                                    <th class="pb-1 px-1">Data</th>
                                </tr>
                            </thead>
                            <tbody id="cache-table-body" class="font-mono"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Main Memory Viewer -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col shadow h-48 overflow-hidden">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-1 mb-2">Main Memory (RAM Bytes)</h2>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left border-collapse text-[11px]">
                        <thead>
                            <tr class="text-slate-400 border-b border-slate-700">
                                <th class="pb-1 px-2">Address</th>
                                <th class="pb-1 px-2">Value / Content</th>
                            </tr>
                        </thead>
                        <tbody id="memory-table-body" class="font-mono"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- Simulator Script -->
    <script>
        let pc = 0;
        let programLines = [];
        let registers = new Array(16).fill(0);
        registers[1] = 15;
        registers[2] = 25;

        // Main Memory (32 bytes initialized with sample data)
        let memory = Array(32).fill(0).map((_, i) => i * 5);

        // Cache (4 Lines)
        let cacheSize = 4;
        let cache = Array(cacheSize).fill(null).map(() => ({ valid: 0, tag: 0, data: 0 }));
        let hits = 0;
        let misses = 0;

        function loadScript() {
            const rawText = document.getElementById('script-input').value;
            programLines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            pc = 0;
            logMessage(`[System] Program loaded successfully with ${programLines.length} instructions.`);
        }

        function renderRegisters() {
            const grid = document.getElementById('register-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-700/60 rounded p-1.5 flex justify-between items-center">
                        <span class="text-[11px] text-slate-400 font-bold">R${i}</span>
                        <span class="text-emerald-400">${registers[i]}</span>
                    </div>
                `;
            }
        }

        function renderCache() {
            const tbody = document.getElementById('cache-table-body');
            tbody.innerHTML = '';
            for (let i = 0; i < cacheSize; i++) {
                const line = cache[i];
                tbody.innerHTML += `
                    <tr class="border-b border-slate-800/60">
                        <td class="py-1 px-1 text-slate-400 font-bold">[${i}]</td>
                        <td class="py-1 px-1 ${line.valid ? 'text-emerald-400 font-bold' : 'text-slate-600'}">${line.valid}</td>
                        <td class="py-1 px-1 text-amber-300">${line.tag}</td>
                        <td class="py-1 px-1 text-sky-300">${line.data}</td>
                    </tr>
                `;
            }
            document.getElementById('cache-stats').innerText = `H: ${hits} | M: ${misses}`;
        }

        function renderMemory() {
            const tbody = document.getElementById('memory-table-body');
            tbody.innerHTML = '';
            for (let i = 0; i < memory.length; i += 4) {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-800/60 hover:bg-slate-900/40">
                        <td class="py-1 px-2 text-slate-400">[0x${i.toString(16).padStart(2, '0')}] (${i})</td>
                        <td class="py-1 px-2 text-emerald-300">${memory[i]}, ${memory[i+1]}, ${memory[i+2]}, ${memory[i+3]}</td>
                    </tr>
                `;
            }
        }

        function logMessage(text, isError = false) {
            const logArea = document.getElementById('log-area');
            const colorClass = isError ? 'text-rose-400' : 'text-slate-300';
            logArea.innerHTML += `<p class="${colorClass}">${text}</p>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        function stepInstruction() {
            if (programLines.length === 0) {
                loadScript();
            }
            if (pc >= programLines.length) {
                logMessage(`[System] End of program reached. Reset to run again.`);
                return;
            }

            const rawInput = programLines[pc];
            const parts = rawInput.replace(/,/g, '').split(/\s+/);
            const op = parts[0]?.toUpperCase();

            try {
                let logText = `[PC: ${pc}] Executing: ${rawInput}\n`;

                if (op === 'LW') {
                    const rd = parseInt(parts[1]?.replace('R', ''));
                    const addr = parseInt(parts[2] || 0);
                    const index = addr % cacheSize;
                    const tag = Math.floor(addr / cacheSize);

                    if (cache[index].valid === 1 && cache[index].tag === tag) {
                        hits++;
                        logText += `-> CACHE HIT at Index ${index} (Tag: ${tag})\n`;
                    } else {
                        misses++;
                        cache[index].valid = 1;
                        cache[index].tag = tag;
                        cache[index].data = memory[addr] !== undefined ? memory[addr] : 42;
                        logText += `-> CACHE MISS. Fetched RAM[${addr}] = ${cache[index].data}\n`;
                    }
                    registers[rd] = cache[index].data;
                    logText += `-> Loaded ${cache[index].data} into R${rd}`;

                } else if (op === 'SW') {
                    const rs1 = parseInt(parts[1]?.replace('R', ''));
                    const addr = parseInt(parts[2] || 0);
                    const val = registers[rs1];
                    const index = addr % cacheSize;
                    const tag = Math.floor(addr / cacheSize);

                    cache[index].valid = 1;
                    cache[index].tag = tag;
                    cache[index].data = val;
                    memory[addr] = val; // Update main memory

                    logText += `-> Stored R${rs1} (${val}) to Cache[${index}] & RAM[${addr}]`;

                } else {
                    const rd = parseInt(parts[1]?.replace('R', ''));
                    const rs1 = parseInt(parts[2]?.replace('R', ''));
                    const rs2 = parseInt(parts[3]?.replace('R', ''));

                    let val1 = registers[rs1];
                    let val2 = registers[rs2];
                    let result = (op === 'ADD') ? val1 + val2 : val1 - val2;
                    registers[rd] = result;

                    logText += `-> ALU (${op}): R${rs1}(${val1}) & R${rs2}(${val2}) = ${result} -> R${rd}`;
                }

                pc++;
                logMessage(logText);
                renderRegisters();
                renderCache();
                renderMemory();

            } catch (err) {
                logMessage(`Error at line ${pc}: ${err.message}`, true);
            }
        }

        function resetSimulator() {
            pc = 0;
            registers.fill(0);
            registers[1] = 15;
            registers[2] = 25;
            cache = Array(cacheSize).fill(null).map(() => ({ valid: 0, tag: 0, data: 0 }));
            memory = Array(32).fill(0).map((_, i) => i * 5);
            hits = 0;
            misses = 0;
            loadScript();
            renderRegisters();
            renderCache();
            renderMemory();
            document.getElementById('log-area').innerHTML = `<p class="text-slate-500">[System] Simulator reset.</p>`;
        }

        // Initial render on load
        loadScript();
        renderRegisters();
        renderCache();
        renderMemory();
    </script>
</body>
</html>
